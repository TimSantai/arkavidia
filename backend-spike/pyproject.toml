[project]
name = "bersama-backend-spike"
version = "0.1.0"
description = "SPIKE pra-Hacking Day: backend & AI BERSAMA. Tidak boleh dibawa ke repo final Hackvidia 11.0."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "asyncpg>=0.29",
  "pyjwt[crypto]>=2.9",
  "numpy>=1.26",
  "structlog>=24.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["litellm>=1.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: butuh Postgres (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
# S608: SQL dinamis hanya menyisipkan fragmen konstanta modul, bukan input pengguna.
# ASYNC109: parameter timeout diteruskan ke provider dan dibungkus asyncio.wait_for.
ignore = ["S101", "S105", "S106", "S608", "ASYNC109", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B007", "S608"]

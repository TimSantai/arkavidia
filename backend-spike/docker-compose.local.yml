# Postgres lokal + pgvector untuk pengembangan dan tes spike. Terpisah dari docker-compose.yml root.
name: bersama-spike
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bersama
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["54329:5432"]
    volumes:
      - ./supabase/local/00_supabase_shim.sql:/docker-entrypoint-initdb.d/00_shim.sql:ro
      - ./supabase/migrations/20261125000000_init.sql:/docker-entrypoint-initdb.d/10_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bersama"]
      interval: 3s
      retries: 20
